name: Verify Public Portfolio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Indexed release audit
        run: python scripts/check_public_release.py
      - name: Portfolio navigation and assets
        run: python scripts/verify_public_links.py
      - name: Photography Mentor release checks
        run: npm test
      - name: Business Learning Studio release checks
        run: npm run verify --prefix business-learning-studio
