name: Verify commercial release

on:
  push:
    branches:
      - "codex/business-learning-commercial-*"
    tags:
      - "business-learning-commercial-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: business-learning-studio-commercial
          path: dist/
          if-no-files-found: error
