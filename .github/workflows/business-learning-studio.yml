name: Verify Business Learning Studio

on:
  pull_request:
    paths:
      - "business-learning-studio/**"
      - ".github/workflows/business-learning-studio.yml"
  push:
    branches:
      - main
    paths:
      - "business-learning-studio/**"
      - ".github/workflows/business-learning-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-learning-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-learning-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
